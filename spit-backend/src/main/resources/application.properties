# ============================================================
# SPIT – Smart Passenger Intelligence Tunisia
# Production Application Configuration
# All secrets are injected via environment variables.
# ============================================================

spring.application.name=spit-backend

# Port – Render injects PORT automatically
server.port=${PORT:8083}

# ── PostgreSQL / Neon DataSource ──────────────────────────
# Set SPRING_DATASOURCE_URL in Render environment variables
# Example Neon URL format:
#   jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/spit?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SPIT}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool – small for free Render tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── CORS ─────────────────────────────────────────────────
# Set CORS_ALLOWED_ORIGINS in Render environment variables
# Example: https://spit-frontend.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:5173}

# ── Jackson ──────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── File Upload ───────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── Actuator (health check for Render) ───────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
